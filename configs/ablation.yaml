# Ablation study configurations

ablation:
  # Ablation 1: Number of components
  k_values: [3, 5, 8, 10, 15, 20, 30]

  # Ablation 2: Window size
  w_values: [25, 50, 75, 100, 150, 200, 300, 500]

  # Ablation 3: Forgetting factor
  lambda_values: [0.80, 0.85, 0.90, 0.93, 0.95, 0.97, 0.99, 1.0]

  # Ablation 4: Score formula
  score_formulas:
    - weighted     # sum_i sigma_i * V[i,j]^2 (ours)
    - unweighted   # sum_i V[i,j]^2
    - recon_error  # per-channel reconstruction error

  # Fixed defaults for non-varied parameter
  defaults:
    n_components: 10
    window_size: 50
    forgetting_factor: 1.0
    budget: 0.5
    min_rate: 0.05

  seeds: [42, 123, 456]

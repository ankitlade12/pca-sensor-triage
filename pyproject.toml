[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-sensor-triage"
version = "0.3.0"
description = "PCA-driven adaptive sensor triage for edge AI inference"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ankit Hemant Lade", email = "ankitlade12@gmail.com"},
    {name = "Sai Krishna Jasti", email = "jsaikrishna379@gmail.com"},
    {name = "Nikhil Sinha", email = "sinha.nikhil77@gmail.com"},
    {name = "Indar Kumar", email = "indarkarhana@gmail.com"},
    {name = "Akanksha Tiwari", email = "akankshat2803@gmail.com"},
]
keywords = ["PCA", "sensor", "triage", "edge AI", "IoT", "bandwidth", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "pyreadr>=0.5",
    "tqdm>=4.65",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "pre-commit>=3.0",
    "ruff>=0.1",
]
stats = [
    "scikit-posthocs>=0.9",
]

[project.urls]
Repository = "https://github.com/ankitlade12/pca-sensor-triage"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

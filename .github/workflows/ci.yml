name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check src/ tests/

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

    - name: Smoke test (core pipeline + v2 features)
      run: |
        python -c "
        from src.triage import TriagePipeline, HybridScorer
        import numpy as np
        X = np.random.randn(500, 20)
        # Test base pipeline (linear interp default)
        pipe = TriagePipeline(n_components=5, window_size=50, budget=0.5)
        result = pipe.process_stream(X, seed=42)
        assert result.shape == X.shape
        assert not np.isnan(result).any()
        # Test hybrid scorer + sharpened allocation
        pipe2 = TriagePipeline(n_components=5, window_size=50, budget=0.5,
                               scorer='hybrid', alpha=0.7, sharpness=2.0)
        result2 = pipe2.process_stream(X, seed=42)
        assert result2.shape == X.shape
        assert not np.isnan(result2).any()
        print(f'Smoke test OK: base + hybrid + sharpened')
        "

    - name: Smoke test (all baselines)
      run: |
        python -c "
        from src.baselines import (
            UniformSampling, ThresholdSampling, VarianceSampling,
            RandomDropout, AutoencoderSampling
        )
        import numpy as np
        X = np.random.randn(500, 20)
        for cls in [UniformSampling, ThresholdSampling, VarianceSampling, RandomDropout]:
            result = cls(budget=0.5).process_stream(X, seed=42)
            assert result.shape == X.shape
        ae = AutoencoderSampling(budget=0.5, window_size=50, bottleneck=5, n_epochs=10)
        result = ae.process_stream(X, seed=42)
        assert result.shape == X.shape
        print('All baseline smoke tests OK')
        "
